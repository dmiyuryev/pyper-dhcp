services:
  dhcp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-999}
        APP_GID: ${APP_GID:-999}
    container_name: pyper-dhcp
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./config:/opt/pyper-dhcp/config:ro
      - ./db:/opt/pyper-dhcp/db
    restart: unless-stopped
